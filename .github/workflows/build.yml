name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ env.THEOS }}

      - name: Create control file (required for packaging)
        run: |
          mkdir -p layout/DEBIAN
          cat > layout/DEBIAN/control <<EOF
          Package: headlocj
          Name: headlocj
          Version: 1.0
          Architecture: iphoneos-arm
          Description: Wasteland modded app
          Maintainer: Ash
          Author: Ash
          Section: Applications
          EOF

      - name: Build package
        run: |
          make package FINALPACKAGE=1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: modded-ipa
          path: packages/*.ipa
