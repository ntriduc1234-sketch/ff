name: Build IPA
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/theos/theos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: |
          make package FINALPACKAGE=1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: modded-ipa
          path: packages/*.ipa
