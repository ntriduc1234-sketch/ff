name: Build IPA
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      SDKROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS14.5.sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make clang lld unzip curl wget cmake ninja-build

      - name: Download Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ env.THEOS }}

      - name: Download iOS SDK
        run: |
          mkdir -p ${{ env.THEOS }}/sdks
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip -d ${{ env.THEOS }}/sdks
          mv ${{ env.THEOS }}/sdks/sdks-master/* ${{ env.THEOS }}/sdks/
          rm -rf ${{ env.THEOS }}/sdks/sdks-master sdks.zip

      - name: Setup toolchain manually (use system clang + SDK)
        run: |
          # Tạo symlink cho clang giả lập iOS
          mkdir -p ${{ env.THEOS }}/toolchain/linux/iphone/bin
          ln -s /usr/bin/clang ${{ env.THEOS }}/toolchain/linux/iphone/bin/clang
          ln -s /usr/bin/clang++ ${{ env.THEOS }}/toolchain/linux/iphone/bin/clang++
          # Tạo file cấu hình để Theos nhận diện
          echo "TARGET = iphone:clang:latest:7.0" > ${{ env.THEOS }}/toolchain/linux/iphone/config.mk

      - name: Verify toolchain
        run: |
          ls -la ${{ env.THEOS }}/toolchain/linux/iphone/bin/
          ${{ env.THEOS }}/toolchain/linux/iphone/bin/clang --version

      - name: Build package
        run: |
          make package FINALPACKAGE=1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: modded-ipa
          path: packages/*.ipa
