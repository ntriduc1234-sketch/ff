name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ env.THEOS }}

      - name: Create control file
        run: |
          mkdir -p layout/DEBIAN
          cat > layout/DEBIAN/control <<EOF
          Package: headlocj
          Name: headlocj
          Version: 1.0
          Architecture: iphoneos-arm
          Description: Wasteland modded app
          Maintainer: Ash
          Author: Ash
          Section: Applications
          EOF

      - name: Build .app
        run: |
          make

      - name: Create IPA from .app
        run: |
          # Tìm file .app (thường nằm trong .theos/obj/...)
          APP_PATH=$(find . -name "*.app" -type d -path "*/obj/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Không tìm thấy file .app!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r headlocj.ipa Payload/
          mkdir -p packages
          mv headlocj.ipa packages/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: modded-ipa
          path: packages/*.ipa
