name: Build IPA
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      SDKROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS14.5.sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make clang lld unzip curl

      - name: Download Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ env.THEOS }}

      - name: Download Theos toolchain (Linux)
        run: |
          rm -rf ${{ env.THEOS }}/toolchain
          git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/theos/toolchain.git ${{ env.THEOS }}/toolchain

      - name: Download iOS SDK
        run: |
          mkdir -p ${{ env.THEOS }}/sdks
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip -d ${{ env.THEOS }}/sdks
          mv ${{ env.THEOS }}/sdks/sdks-master/* ${{ env.THEOS }}/sdks/
          rm -rf ${{ env.THEOS }}/sdks/sdks-master sdks.zip

      - name: Verify SDK exists
        run: |
          ls -la ${{ env.THEOS }}/sdks/
          test -d ${{ env.SDKROOT }} || (echo "SDK missing!" && exit 1)

      - name: Build package
        run: |
          make package FINALPACKAGE=1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: modded-ipa
          path: packages/*.ipa
